<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
</head>
<body>
    <h2>Thông tin đặt hàng</h2>
    <form id="checkout-form">
        <input type="text" id="customer_name" placeholder="Họ và tên" required><br><br>
        <input type="text" id="phone" placeholder="Số điện thoại" required><br><br>
        <textarea id="address" placeholder="Địa chỉ giao hàng" required></textarea><br><br>
        <button type="submit">Xác nhận đặt hàng</button>
    </form>

    <script src="user-script.js"></script>
</body>
</html>
